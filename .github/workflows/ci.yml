name: CI

# Where each check runs (decided 2026-10-12, narrowed 2026-10-23, the full
# gate moved out of the merge path 2026-11-19):
# - An ordinary pull request, its merge queue run and each push to main get
#   the fast gate: the Linux gate without the end-to-end tests and the
#   golden run. Each queued pull request is tested merged with main and with
#   every pull request ahead of it in the queue. A pull request whose run
#   fails leaves the queue, and main does not change.
# - A push to main skips the gate when this workflow's merge queue run on the
#   same commit passed: the queue pushes the very commit it tested, so the
#   tree, this file and the gate are the same. A direct push, or a lookup
#   that fails, runs the gate.
# - The full gate (the Linux gate with the end-to-end tests and the golden
#   run, the macOS gate and the scanner-only benchmark) runs in three cases:
#   the nightly run on main and its button (.github/workflows/nightly.yml);
#   the release, on the commit it publishes (.github/workflows/release.yml);
#   a pull request with the label full-ci. The first two call this workflow
#   with the input full set to true.
# - The cost: a break that only the full gate catches lands on main and shows
#   in the nightly run, which opens an issue. The release refuses to publish
#   a commit whose own full gate did not pass.
# The ruleset on main requires the three gate checks by these job names, so
# the names do not change. A job skipped by its condition counts as passed:
# that is how a fast-gate run passes with the Linux gate alone.
# scripts/gate.sh runs the fast gate's steps (.github/actions/gate) on one
# machine, and the full gate's with --full; the benchmark job runs in CI only.

on:
  pull_request:
    # labeled: adding full-ci to an open pull request starts the full gate.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: true runs the full gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # On a push to main, whether this workflow's merge queue run on the same
  # commit passed. It prints tested=true only on a run it found; a failed
  # lookup prints false, and the gate runs.
  queue-tested:
    name: Merge queue tested this commit
    if: ${{ github.event_name == 'push' && inputs.full != true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          found=$(gh run list --workflow ci.yml --event merge_group --commit "$GITHUB_SHA" --status success --json headSha --jq "map(select(.headSha == \"$GITHUB_SHA\")) | length" || echo 0)
          if [ "$found" -gt 0 ] 2>/dev/null; then tested=true; else tested=false; fi
          echo "The merge queue's passed runs on $GITHUB_SHA: $found, so tested=$tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  gate:
    name: Gate (ubuntu-latest)
    needs: queue-tested
    # Runs on every event but a push the merge queue tested; !cancelled()
    # keeps it running when queue-tested is skipped or failed.
    if: ${{ !cancelled() && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate
        with:
          # The full gate's condition. The two jobs below carry the same
          # expression: a job's if cannot read a shared value.
          full: ${{ inputs.full == true || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}

  gate-macos:
    name: Gate (macos-latest)
    if: ${{ inputs.full == true || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate

  # The scanner-only benchmark on the frozen planted cases with every
  # scanner installed, two passes on one build, and its trend gate against
  # the scanner-only run main's benchmark/index accepts. It fails when the
  # two passes differ, or when the score dropped against main's accepted
  # run, or moved and the branch does not accept the new number
  # (benchmark/trend.mjs --against-run).
  # scripts/gate.sh does not run it: it needs Ruby and Go.
  bench-scan:
    name: Scanner-only benchmark
    if: ${{ inputs.full == true || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The scanners' install root, and the folder the artifact is made of.
      # The runs lie inside the checkout (benchmark/results is ignored by
      # git) because a score names its run folder relative to the repository
      # only when the folder is in it; outside it the score holds the
      # runner's home path, and publish-run.mjs refuses to package it.
      - name: Name the folders
        run: |
          echo "OPENQODEX_HOME=$RUNNER_TEMP/openqodex-bench-home" >> "$GITHUB_ENV"
          echo "BENCH=$GITHUB_WORKSPACE/benchmark/results/bench-scan" >> "$GITHUB_ENV"
      # The commit the run builds is the commit an accepted index entry
      # names (benchmark/build-cli.mjs records it, trend.mjs --accept copies
      # it), so it must stay in main's history:
      # - In the nightly run, its button and the release, github.sha is a
      #   commit on main: main's head when the run started, or the commit
      #   the release publishes.
      # - On a pull request with the label full-ci, the pull request's own
      #   head, not the merge commit GitHub makes: the queue merges with a
      #   merge commit, so the head stays in main's history, and GitHub's
      #   merge commit is not kept once the pull request closes. This is the
      #   run to accept when a pull request moves the score. A branch older
      #   than the harness runs the old harness here; merge main into it.
      # Since 2026-11-19 neither the merge queue nor a push to main runs this
      # job; before, the queue ran it for the version pull request (issue
      # 159) and every push to main did.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Node, Ruby, Go, the build and every scanner, cached: the one recipe
      # this job and bench-weekly.yml share.
      - uses: ./.github/actions/bench-setup
      - name: Scan the planted cases twice
        run: |
          run_id="$(date -u +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)-planted-scan-ci"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          node benchmark/run.mjs --mode scan --check-identical --out "$BENCH/results/$run_id"
      # The run is judged against the accepted run on main, read from main at
      # this moment: a pull request head's own copy of the index may be older
      # than main's. The checkout's copy is passed too (in the merge queue,
      # main's copy with the queued pull requests' entries), so a branch that
      # accepts a new run is named in the summary.
      - name: Read the accepted runs on main
        if: ${{ !cancelled() && env.RUN_ID != '' }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/main-index"
          git archive FETCH_HEAD benchmark/index | tar -x -C "$RUNNER_TEMP/main-index"
      - name: Trend against the accepted run
        if: ${{ !cancelled() && env.RUN_ID != '' }}
        run: node benchmark/trend.mjs --mode scan --against-run "$BENCH/results/$RUN_ID" --index "$RUNNER_TEMP/main-index/benchmark/index" --branch-index benchmark/index --summary "$GITHUB_STEP_SUMMARY"
      # The entry a person commits to accept this run (benchmark/trend.mjs
      # --accept), written from the run folder the artifact holds.
      - name: Write the run's index entry
        if: ${{ !cancelled() && env.RUN_ID != '' }}
        run: |
          node benchmark/publish-run.mjs "$BENCH/results/$RUN_ID" --dry-run --write-index --out "$BENCH/asset"
          mkdir -p "$BENCH/index/runs"
          cp "benchmark/index/runs/$RUN_ID.json" "$BENCH/index/runs/"
          {
            echo ""
            echo "The run folders and this index entry are in the artifact bench-scan-$RUN_ID, kept 14 days. \`gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name bench-scan-$RUN_ID --dir <dir>\` puts the run folder at \`<dir>/results/$RUN_ID\`, so \`<results>\` above is \`<dir>/results\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && env.RUN_ID != '' }}
        with:
          name: bench-scan-${{ env.RUN_ID }}
          path: benchmark/results/bench-scan
          retention-days: 14
          if-no-files-found: error

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # golangci-lint needs Go on PATH; the end-to-end tests fail in CI when
      # any scanner is skipped.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint 2.12.2 is built with Go 1.26 and cannot check a newer Go.
          go-version: "1.26"
          cache: false
      # cargo-deny needs Cargo, and the macOS runner image has no Rust
      # toolchain; the end-to-end tests fail in CI when any scanner is missing.
      - if: runner.os == 'macOS'
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
      - run: pnpm install --frozen-lockfile
      # The end-to-end tests install the pinned scanners once into this folder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openqodex-e2e-home
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/scanners/toolchain.json', 'packages/scanners/locks/**') }}
      # The steps below mirror scripts/gate.sh one for one.
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Only the two test steps get the token: the custom scanner tests read a
      # release from the GitHub API, and hosted runners share addresses, so the
      # anonymous rate limit is often spent. Install and build never see it.
      - name: Unit tests
        run: pnpm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          OPENQODEX_E2E_HOME: ${{ runner.temp }}/openqodex-e2e-home
          GITHUB_TOKEN: ${{ github.token }}
      # The review of the demo's planted change with both reviewer drivers,
      # compared file by file with tests/golden/expected.
      - name: Golden run
        run: pnpm golden:check
      - name: Skill and plugin manifests
        run: node scripts/validate-skill.mjs
      - name: Config docs
        run: node scripts/config-docs.mjs --check
      - name: Private material scrub
        run: node scripts/scrub.mjs

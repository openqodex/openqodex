name: Release

# On every push to main, changesets/action does one of two things:
# - when changesets are waiting, it opens or updates the "Version packages"
#   pull request, which bumps the version and writes CHANGELOG.md;
# - when that pull request has merged and no changeset is left, it publishes
#   the new version to npm with provenance, tags it and makes a GitHub release.
#   Once the version is on the registry, the last step tags it v<version> and
#   moves the v0 tag the GitHub Action is used by.
# Nothing else runs this workflow: not pull requests, not other branches.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    if: github.repository == 'openqodex/openqodex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      # The version published in this run, empty when none was.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version pull request or publish
        id: changesets
        # v1 of the action works with Changesets CLI 2, which this repo uses.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Bumps the version, writes CHANGELOG.md and rewrites every pinned
          # openqodex@<version> in the skill, the plugin, the Action and the
          # pre-commit hook, so the gate's version check passes.
          version: pnpm version-packages
          # Builds, then publishes through changeset publish.
          publish: pnpm release
          commit: Version packages
          title: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Tag v<version> and move v<major>
        # Only after a publish. Tags only, never a branch: the major tag of the
        # published version is the one that moves, so `uses: openqodex/openqodex@v0`
        # gets each 0.x release and never a 1.0.0.
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(node -e 'const p = JSON.parse(process.env.PUBLISHED).find((x) => x.name === "openqodex"); if (p) process.stdout.write(p.version)')
          if [ -z "$version" ]; then echo "openqodex was not published in this run"; exit 0; fi
          # The registry can take a moment to show a new version.
          # Up to ten minutes: on 0.3.0 two minutes was not enough.
          for attempt in $(seq 1 30); do
            if [ "$(npm view "openqodex@$version" version 2>/dev/null)" = "$version" ]; then break; fi
            if [ "$attempt" = 30 ]; then echo "openqodex@$version is not on the registry; no tag moved"; exit 1; fi
            sleep 20
          done
          git rev-parse -q --verify "refs/tags/v$version" >/dev/null || git tag "v$version"
          git push origin "refs/tags/v$version"
          major=${version%%.*}
          case "$major" in ''|*[!0-9]*) echo "cannot read the major version of $version; no major tag moved"; exit 1 ;; esac
          git tag -f "v$major"
          git push --force origin "refs/tags/v$major"
      - name: The version published
        id: version
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(node -e 'const p = JSON.parse(process.env.PUBLISHED).find((x) => x.name === "openqodex"); if (p) process.stdout.write(p.version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check-self-update:
    name: Check the self-update into the new release
    # A check only, in a job of its own after the publish, which never waits
    # on it: no secret, no npm token, no id-token, a GITHUB_TOKEN that can
    # only read, and a checkout of this repository's tag of the new version
    # that keeps no credentials. The script checks the provenance of every
    # release before it runs it, as the updater does, and runs each with an
    # environment built from an allowlist. In a temp HOME it installs the
    # release before this one for all four agents, edits their files the way
    # a developer does, updates on the daily route and with update --now, and
    # fails when an update wrote anything outside its runtime state or left
    # the agents' permission rules short of the new procedure. Then it
    # preinstalls every scanner of the new version into a clean install root
    # on Linux and runs each one on its check case (the clean-root preinstall
    # test, which the pull request gate skips for its 1 GB of downloads). A
    # failure marks the run; it cannot publish, tag, push or roll anything
    # back.
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # golangci-lint needs Go on PATH for the clean-root preinstall; the
      # check fails when any scanner is missing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint 2.12.2 is built with Go 1.26 and cannot check a newer Go.
          go-version: "1.26"
          cache: false
      # The esbuild and Sigstore modules the check verifies with; no
      # dependency's install script runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the self-update from the release before
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/check-self-update.mjs --from previous --to "$VERSION" --route both
      # Runs whatever the self-update check found, unless the run was cancelled.
      - name: Build the new version
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Preinstall every scanner into a clean install root
        if: ${{ !cancelled() }}
        env:
          OPENQODEX_PREINSTALL_FULL: "1"
        run: pnpm exec vitest run --config vitest.e2e.config.ts tests/e2e/preinstall-full.test.ts

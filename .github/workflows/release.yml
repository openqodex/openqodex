name: Release

# On every push to main, changesets/action does one of two things:
# - when changesets are waiting, it opens or updates the "Version packages"
#   pull request, which bumps the version and writes CHANGELOG.md;
# - when that pull request has merged and no changeset is left, it publishes
#   the new version to npm with provenance, tags it and makes a GitHub release.
#   Once the version is on the registry, the last step tags it v<version> and
#   moves the v0 tag the GitHub Action is used by.
# Before either, the release-check job compares the build about to be
# published with the published package (benchmark/release-check.mjs); on a
# push that publishes, a loss, or a check that could not run, stops the
# publish. The ci-passed job waits for this commit's own CI run on main and
# stops the release unless that run passed.
# The release job pushes the version branch and the tags as the openqodex
# GitHub App (repository variable APP_CLIENT_ID, secret APP_PRIVATE_KEY), not
# with the workflow's own token: GitHub starts no workflow run for a push made
# with that token, so the version pull request's checks would wait for a
# click.
# Nothing else runs this workflow: not pull requests, not other branches.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    name: Published package against this build
    # The benchmark's release check (docs/benchmark.md, "The release
    # check"): the published openqodex and this build scan the planted
    # cases, each twice, with every scanner installed and no model, and are
    # compared case by case; a planted bug the published package found and
    # this build misses is a loss. It works only when this push publishes:
    # no changeset waits and the version in packages/cli is not on npm yet.
    # On any other push it ends at once, so the version pull request is
    # never held. A job of its own, with no secret, no id-token and a token
    # that can only read, because it runs the published package's code and
    # every scanner on the repository; and no Actions cache, so nothing it
    # runs can reach a cache a later job restores. Any exit but 0 fails it,
    # and the release job then does not run: a loss refuses the publish, and
    # so does a check that could not run, which shows nothing either way.
    # Run the workflow again when the report says the Semgrep rule packs
    # moved between the two runs. Before the comparison, it preinstalls
    # every scanner of this build into a clean install root and runs each
    # on its check case (the clean-root preinstall test), so a failure
    # there stops the publish instead of following it (issue 224).
    if: github.repository == 'openqodex/openqodex'
    runs-on: ubuntu-latest
    # The clean-root preinstall takes up to 30 minutes of the total.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Does this push publish
        id: publish
        run: |
          waiting=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$waiting" -gt 0 ]; then
            echo "$waiting changesets wait, so this push opens or updates the version pull request and publishes nothing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$(npm view "openqodex@$version" version 2>/dev/null)" = "$version" ]; then
            echo "openqodex@$version is on npm already, so this push publishes nothing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "This push publishes openqodex@$version, so the release check runs."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # The scanners' install root, the package cache and the check's folder.
      # The runs lie inside the checkout (benchmark/results is ignored by
      # git), as in the bench-scan job.
      - name: Name the folders
        if: steps.publish.outputs.publish == 'true'
        run: |
          {
            echo "OPENQODEX_HOME=$RUNNER_TEMP/openqodex-bench-home"
            echo "OPENQODEX_BENCH_CACHE=$RUNNER_TEMP/openqodex-bench-cache"
            echo "CHECK=$GITHUB_WORKSPACE/benchmark/results/release-check"
          } >> "$GITHUB_ENV"
      # The setup of .github/actions/bench-setup without its cache: Node 22
      # and the workspace, Ruby 3.3 for brakeman and rubocop, Go 1.26 for
      # golangci-lint, this build with its commit recorded, and every
      # scanner it pins, installed cold.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.publish.outputs.publish == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.publish.outputs.publish == 'true'
        with:
          node-version: 22
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        if: steps.publish.outputs.publish == 'true'
        with:
          ruby-version: "3.3"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.publish.outputs.publish == 'true'
        with:
          # golangci-lint 2.12.2 is built with Go 1.26 and cannot check a newer Go.
          go-version: "1.26"
          cache: false
      - name: Build and install every scanner this build pins
        if: steps.publish.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          node benchmark/build-cli.mjs
          node packages/cli/dist/bin.js doctor --install --all-scanners --require-all
      # The same test check-self-update runs after the publish, on this build.
      - name: Preinstall every scanner into a clean install root
        if: steps.publish.outputs.publish == 'true'
        env:
          OPENQODEX_PREINSTALL_FULL: "1"
        run: pnpm exec vitest run --config vitest.e2e.config.ts tests/e2e/preinstall-full.test.ts
      # --install-scanners adds every scanner the published package pins at
      # another version, so both builds run the same scanners.
      - name: Compare this build with the published package
        if: steps.publish.outputs.publish == 'true'
        run: node benchmark/release-check.mjs --suites planted --install-scanners --out "$CHECK" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.publish.outputs.publish == 'true' }}
        with:
          name: release-check-${{ github.sha }}
          path: benchmark/results/release-check
          retention-days: 14
          if-no-files-found: ignore

  ci-passed:
    name: CI passed on this commit
    # A red main run blocks the version pull request and the publish: this
    # job finds the CI workflow's push run for this commit, waits up to 90
    # minutes while it is queued or running, and fails unless it ended with
    # success; a run that does not show up within 3 minutes fails it too. A
    # job of its own, not a step of the release job, so the App token there
    # (valid for one hour) is made only after the wait.
    if: github.repository == 'openqodex/openqodex'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for this commit's CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-ci-check.mjs "$GITHUB_SHA"

  release:
    name: Version or publish
    needs: [release-check, ci-passed]
    if: github.repository == 'openqodex/openqodex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      # The version published in this run, empty when none was.
      version: ${{ steps.version.outputs.version }}
    steps:
      # A token of the openqodex GitHub App, installed on this repository
      # only. The checkout stores it as the git credential, so the branch
      # push of changesets/action (git-cli mode) and the tag pushes below go
      # out as the App, and the version pull request's pull_request run
      # starts on its own.
      - name: Token of the GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version pull request or publish
        id: changesets
        # v1 of the action works with Changesets CLI 2, which this repo uses.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Bumps the version, writes CHANGELOG.md and rewrites every pinned
          # openqodex@<version> in the skill, the plugin, the Action and the
          # pre-commit hook, so the gate's version check passes.
          version: pnpm version-packages
          # Builds, then publishes through changeset publish.
          publish: pnpm release
          commit: Version packages
          title: Version packages
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Tag v<version> and move v<major>
        # Only after a publish. Tags only, never a branch: the major tag of the
        # published version is the one that moves, so `uses: openqodex/openqodex@v0`
        # gets each 0.x release and never a 1.0.0.
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(node -e 'const p = JSON.parse(process.env.PUBLISHED).find((x) => x.name === "openqodex"); if (p) process.stdout.write(p.version)')
          if [ -z "$version" ]; then echo "openqodex was not published in this run"; exit 0; fi
          # The registry can take a moment to show a new version.
          # Up to ten minutes: on 0.3.0 two minutes was not enough.
          for attempt in $(seq 1 30); do
            if [ "$(npm view "openqodex@$version" version 2>/dev/null)" = "$version" ]; then break; fi
            if [ "$attempt" = 30 ]; then echo "openqodex@$version is not on the registry; no tag moved"; exit 1; fi
            sleep 20
          done
          git rev-parse -q --verify "refs/tags/v$version" >/dev/null || git tag "v$version"
          git push origin "refs/tags/v$version"
          major=${version%%.*}
          case "$major" in ''|*[!0-9]*) echo "cannot read the major version of $version; no major tag moved"; exit 1 ;; esac
          git tag -f "v$major"
          git push --force origin "refs/tags/v$major"
      - name: The version published
        id: version
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(node -e 'const p = JSON.parse(process.env.PUBLISHED).find((x) => x.name === "openqodex"); if (p) process.stdout.write(p.version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check-self-update:
    name: Check the self-update into the new release
    # A check only, in a job of its own after the publish, which never waits
    # on it: no secret, no npm token, no id-token, a GITHUB_TOKEN that can
    # only read, and a checkout of this repository's tag of the new version
    # that keeps no credentials. The script checks the provenance of every
    # release before it runs it, as the updater does, and runs each with an
    # environment built from an allowlist. In a temp HOME it installs the
    # release before this one for all four agents, edits their files the way
    # a developer does, updates on the daily route and with update --now, and
    # fails when an update wrote anything outside its runtime state or left
    # the agents' permission rules short of the new procedure. Then it
    # preinstalls every scanner of the new version into a clean install root
    # on Linux and runs each one on its check case (the clean-root preinstall
    # test, which the pull request gate skips for its 1 GB of downloads). A
    # failure marks the run; it cannot publish, tag, push or roll anything
    # back.
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # golangci-lint needs Go on PATH for the clean-root preinstall; the
      # check fails when any scanner is missing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint 2.12.2 is built with Go 1.26 and cannot check a newer Go.
          go-version: "1.26"
          cache: false
      # The esbuild and Sigstore modules the check verifies with; no
      # dependency's install script runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the self-update from the release before
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/check-self-update.mjs --from previous --to "$VERSION" --route both
      # Runs whatever the self-update check found, unless the run was cancelled.
      - name: Build the new version
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Preinstall every scanner into a clean install root
        if: ${{ !cancelled() }}
        env:
          OPENQODEX_PREINSTALL_FULL: "1"
        run: pnpm exec vitest run --config vitest.e2e.config.ts tests/e2e/preinstall-full.test.ts

name: "OpenQodex Scan: SAST, Secret Scanning and Lint for Pull Requests"
description: "Code review scanners for pull requests: SAST, secrets, dependencies and lint on changed lines. Scanners only, not a review."
author: OpenQodex
branding:
  icon: check-circle
  color: purple

inputs:
  version:
    description: The openqodex version to run. The release workflow sets the default to the version it publishes.
    required: false
    default: "0.6.1"
  upload-sarif:
    description: Upload the findings to GitHub code scanning as SARIF.
    required: false
    default: "true"
  block-on-severity:
    description: Fail the job on a finding at or above this severity (info, nitpick, minor, major or critical). It wins over the block_on_severity in the repository's config, which a pull request can change. Empty uses the config.
    required: false
    default: ""
  fail-on-tool-error:
    description: Fail the job when OpenQodex itself could not run the scan (exit 2). By default a tool failure is a warning.
    required: false
    default: "false"
  config-from:
    description: In a pull request, read the OpenQodex config from the base branch (base, the default) or from the pull request's own code (head). The pull request's author can change the head config to hide findings.
    required: false
    default: "base"

outputs:
  status:
    description: passed, blocked or tool-failed.
    value: ${{ steps.scan.outputs.status }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.openqodex/tools
        key: openqodex-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    # Inputs and event values reach the script through the environment only,
    # never pasted into it, so a branch name cannot inject a command. The
    # script (scripts/action-scan.sh) validates them, installs the scanners
    # and scans under one tool-failure policy.
    - name: Scan the change
      id: scan
      shell: bash
      env:
        OPENQODEX_VERSION: ${{ inputs.version }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.base_ref }}
        BLOCK_ON_SEVERITY: ${{ inputs.block-on-severity }}
        CONFIG_FROM: ${{ inputs.config-from }}
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action-scan.sh"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: openqodex

    - name: Fail on blocking findings or a tool failure
      if: steps.scan.outputs.exit-code == '1' || (steps.scan.outputs.exit-code == '2' && inputs.fail-on-tool-error == 'true')
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        if [ "$CODE" = "1" ]; then
          echo "OpenQodex found findings at or above the block severity."
        else
          echo "OpenQodex could not run the scan, and fail-on-tool-error is true."
        fi
        exit 1

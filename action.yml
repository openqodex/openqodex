name: "OpenQodex AI Code Review: SAST, Secret Scanning and Lint for Pull Requests"
description: "AI code review and scanners for pull requests: SAST, secrets, dependencies, lint. Review needs your Anthropic key."
author: OpenQodex
branding:
  icon: check-circle
  color: purple

inputs:
  version:
    description: The openqodex version to run, an exact release version such as 0.6.1. The release workflow sets the default to the version it publishes.
    required: false
    default: "0.11.1"
  review:
    description: auto runs the full review when the step's environment holds ANTHROPIC_API_KEY, and the scanners only without it. off always runs the scanners only. required always attempts the review and fails the job unless the review completes or the change has nothing to review.
    required: false
    default: "auto"
  claude-code-version:
    description: The Claude Code version the review runs, an exact release version. The Action installs it from npm into the runner's temporary folder unless the runner's own claude is that version.
    required: false
    default: "2.1.289"
  upload-sarif:
    description: Upload the findings to GitHub code scanning as SARIF.
    required: false
    default: "true"
  block-on-severity:
    description: Fail the job on a finding at or above this severity (info, nitpick, minor, major or critical). It wins over the block_on_severity in the repository's config, which a pull request can change. Empty uses the config.
    required: false
    default: ""
  fail-on-tool-error:
    description: Fail the job when OpenQodex itself could not run the scan or complete the review (exit 2). By default a tool failure is a warning.
    required: false
    default: "false"
  config-from:
    description: In a pull request, read the OpenQodex config and the review's custom instructions from the base branch (base, the default) or from the pull request's own code (head). The pull request's author can change the head files to hide findings.
    required: false
    default: "base"

outputs:
  status:
    description: passed, blocked or tool-failed.
    value: ${{ steps.scan.outputs.status }}
  reviewed:
    description: true only when this run produced a complete review.
    value: ${{ steps.scan.outputs.reviewed }}
  review-status:
    description: complete, incomplete, unavailable (no reviewer could start), skipped (nothing to review) or off (the job ran the scanners only).
    value: ${{ steps.scan.outputs.review-status }}
  reviewer:
    description: The reviewer of this run and its version, such as claude 2.1.289. Empty when no reviewer started.
    value: ${{ steps.scan.outputs.reviewer }}

runs:
  using: composite
  # Every step here inherits the environment of the workflow step that uses
  # this Action, ANTHROPIC_API_KEY included. Each step but the one that runs
  # the script sets it empty, so setup-node, the cache, the SARIF upload and
  # the last step never hold the key.
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      env:
        ANTHROPIC_API_KEY: ""
      with:
        node-version: 22

    # Which scanners this repository's files call for, and the hash of the
    # pinned scanner table: the cache key below. Nothing is installed here.
    - name: Plan the scanner downloads
      id: plan
      shell: bash
      env:
        ANTHROPIC_API_KEY: ""
        OPENQODEX_STEP: plan
        OPENQODEX_VERSION: ${{ inputs.version }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.base_ref }}
        BLOCK_ON_SEVERITY: ${{ inputs.block-on-severity }}
        CONFIG_FROM: ${{ inputs.config-from }}
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REVIEW: ${{ inputs.review }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action-scan.sh"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        ANTHROPIC_API_KEY: ""
      with:
        path: ~/.openqodex/tools
        key: ${{ steps.plan.outputs.cache-key }}

    # Inputs and event values reach the script through the environment only,
    # never pasted into it, so a branch name cannot inject a command. The key
    # is not an input: the workflow sets ANTHROPIC_API_KEY on the step that
    # uses this Action. The script (scripts/action-scan.sh) validates the
    # inputs, decides between the review and the scanners only, and runs them
    # under one tool-failure policy; it hands the key to the review command
    # alone.
    - name: Review or scan the change
      id: scan
      shell: bash
      env:
        OPENQODEX_VERSION: ${{ inputs.version }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.base_ref }}
        BLOCK_ON_SEVERITY: ${{ inputs.block-on-severity }}
        CONFIG_FROM: ${{ inputs.config-from }}
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REVIEW: ${{ inputs.review }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/action-scan.sh"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      env:
        ANTHROPIC_API_KEY: ""
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: openqodex

    # A blocking finding fails the job whatever fail-on-tool-error says;
    # review: required fails it without a complete review.
    - name: Fail on blocking findings, a missing review or a tool failure
      if: steps.scan.outputs.exit-code == '1' || (steps.scan.outputs.exit-code == '2' && inputs.fail-on-tool-error == 'true') || (inputs.review == 'required' && steps.scan.outputs.review-status != 'complete' && steps.scan.outputs.review-status != 'skipped')
      shell: bash
      env:
        ANTHROPIC_API_KEY: ""
        CODE: ${{ steps.scan.outputs.exit-code }}
        REVIEW: ${{ inputs.review }}
        REVIEW_STATUS: ${{ steps.scan.outputs.review-status }}
      run: |
        if [ "$CODE" = "1" ]; then
          echo "OpenQodex found findings at or above the block severity."
        elif [ "$REVIEW" = "required" ] && [ "$REVIEW_STATUS" != "complete" ] && [ "$REVIEW_STATUS" != "skipped" ]; then
          echo "review is required, and this job has no complete review (review-status: $REVIEW_STATUS)."
        else
          echo "OpenQodex could not run the scan or complete the review, and fail-on-tool-error is true."
        fi
        exit 1
